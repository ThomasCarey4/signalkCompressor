[package]
name = "signalkCompressor"
version = "0.1.0"
edition = "2024"

[dependencies]
byteorder = "1.5.0"
futures-util = "0.3.31"
once_cell = "1.21.3"
regex = "1.11.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = ["full"] }
tokio-tungstenite = "0.27.0"
tungstenite = "0.27.0"
tracing = "0.1.41"
url = "2.5.7"
zstd = "0.13.3"
chrono = { version = "0.4.42", features = ["serde"] }
tracing-subscriber = "0.3.20"
dotenvy = "0.15.7"
reqwest = { version = "0.12.23", features = ["json", "stream"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
anyhow = "1.0.99"
bincode = "2.0.1"
